[project]
name = "engineering-intelligence-platform"
version = "0.6.0"
description = "Evidence-backed engineering intelligence: PR Guardian, governed retrieval, and a bounded control plane"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
# Runtime dependencies are pinned exactly in app/requirements.txt, which the
# container image and CI install from. This list mirrors it without pins so
# tooling that reads project metadata sees the same closure.
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "azure-identity",
  "azure-search-documents",
  "azure-cosmos",
  "openai",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "PyJWT[crypto]",
  "temporalio",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[build-system]
# This exact pin is installed by requirements/build.txt before CI runs its
# intentionally non-isolated wheel inventory check.
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The release image deliberately ships implicit namespace packages. Make that
# choice explicit so setuptools distribution discovery matches the image and
# app.import_closure contract below.
namespaces = true
include = [
  "app*", "company_brain*", "control_plane*", "feedback*", "finops*", "ingestion*",
  "integrations*", "intelligence*", "orchestration*", "portal*", "product*", "remediation*",
  "resilience*", "security*", "state*", "telemetry*", "topology*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with undefined-name/import correctness.  Style and modernization rules
# are intentionally introduced later, after their own measured baselines exist.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
