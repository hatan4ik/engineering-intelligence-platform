<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Execution: catalog membership, deterministic policy, plan-bound approval and simulation gate every mutation; verification decides close or rollback"><defs><marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8b8983"/></marker><marker id="arrow-good-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0ca30c"/></marker><marker id="arrow-bad-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#e66767"/></marker><marker id="arrow-warn-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ec835a"/></marker></defs><rect x="0" y="0" width="980" height="350" rx="14" fill="#1a1a19"/><rect x="0.5" y="0.5" width="979" height="349" rx="14" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="28" y="40" font-size="16" text-anchor="start" fill="#ffffff" font-weight="700">Execution plane — the authorization gauntlet</text><text x="28" y="60" font-size="12" text-anchor="start" fill="#c3c2b7" font-weight="normal">Agents select from a closed catalog; adapters run fixed commands — never composed strings</text><rect x="24" y="124" width="136" height="52" rx="9" fill="#2d201a" stroke="#2c2c2a" stroke-width="1"/><rect x="24" y="124" width="4" height="52" rx="2" fill="#d95926"/><text x="92.0" y="146.68" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">Proposed action</text><text x="92.0" y="162.68" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal">agent output</text><polygon points="258,115.0 324.0,150 258,185.0 192.0,150" fill="#291e21" stroke="#803e56" stroke-width="1.2"/><text x="258" y="147" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">in certified</text><text x="258" y="161" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">catalog?</text><polygon points="448,115.0 512.0,150 448,185.0 384.0,150" fill="#291e21" stroke="#803e56" stroke-width="1.2"/><text x="448" y="147" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">policy</text><text x="448" y="161" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">authorize()?</text><polygon points="636,115.0 702.0,150 636,185.0 570.0,150" fill="#291e21" stroke="#803e56" stroke-width="1.2"/><text x="636" y="147" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">approval /</text><text x="636" y="161" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">simulation</text><rect x="760" y="124" width="96" height="52" rx="9" fill="#2d2023" stroke="#2c2c2a" stroke-width="1"/><rect x="760" y="124" width="4" height="52" rx="2" fill="#d55181"/><text x="808.0" y="146.68" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">Execute</text><text x="808.0" y="162.68" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal">fixed args</text><polygon points="918,118.0 968.0,150 918,182.0 868.0,150" fill="#291e21" stroke="#803e56" stroke-width="1.2"/><text x="918" y="154" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">verify</text><path d="M 160 150 L 192 150" fill="none" stroke="#8b8983" stroke-width="1.6" marker-end="url(#arrow-dark)"/><path d="M 324 150 L 384 150" fill="none" stroke="#8b8983" stroke-width="1.6" marker-end="url(#arrow-dark)"/><text x="354.0" y="142" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">yes</text><path d="M 512 150 L 570 150" fill="none" stroke="#8b8983" stroke-width="1.6" marker-end="url(#arrow-dark)"/><text x="541.0" y="142" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">allow</text><path d="M 702 150 L 760 150" fill="none" stroke="#8b8983" stroke-width="1.6" marker-end="url(#arrow-dark)"/><text x="731.0" y="142" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">pass</text><path d="M 856 150 L 868 150" fill="none" stroke="#8b8983" stroke-width="1.6" marker-end="url(#arrow-dark)"/><rect x="300" y="260" width="286" height="52" rx="9" fill="#252523" stroke="#2c2c2a" stroke-width="1"/><rect x="300" y="260" width="4" height="52" rx="2" fill="#898781"/><text x="443.0" y="282.68" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">Escalate to human</text><text x="443.0" y="298.68" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal">audited — never silent</text><path d="M 258 185 L 258 286 L 300 286" fill="none" stroke="#8b8983" stroke-width="1.6" marker-end="url(#arrow-dark)"/><text x="270" y="212" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">no</text><path d="M 448 185 L 448 260" fill="none" stroke="#8b8983" stroke-width="1.6" marker-end="url(#arrow-dark)"/><text x="468" y="212" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">deny</text><path d="M 636 185 L 560 259" fill="none" stroke="#8b8983" stroke-width="1.6" marker-end="url(#arrow-dark)"/><text x="680" y="212" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">reject / stale</text><rect x="700" y="260" width="110" height="52" rx="9" fill="#2d2023" stroke="#2c2c2a" stroke-width="1"/><rect x="700" y="260" width="4" height="52" rx="2" fill="#d55181"/><text x="755.0" y="282.68" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">Rollback</text><text x="755.0" y="298.68" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal">compensate</text><path d="M 918 182 L 918 286 L 810 286" fill="none" stroke="#ec835a" stroke-width="1.6" marker-end="url(#arrow-warn-dark)"/><text x="940" y="212" font-size="10.5" text-anchor="middle" fill="#c3c2b7" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">unhealthy</text><path d="M 700 286 L 590 286" fill="none" stroke="#e66767" stroke-width="1.6" marker-end="url(#arrow-bad-dark)"/><text x="645.0" y="278" font-size="11" text-anchor="middle" fill="#c3c2b7" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">then escalate</text><rect x="858.0" y="45" width="120" height="30" rx="15" fill="#182a17" stroke="#1c681b" stroke-width="1"/><text x="918" y="64.5" font-size="12" text-anchor="middle" fill="#92d692" font-weight="600">close + audit</text><path d="M 918 118 L 918 76" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arrow-good-dark)"/><text x="940" y="110" font-size="10.5" text-anchor="middle" fill="#c3c2b7" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">healthy</text></svg>