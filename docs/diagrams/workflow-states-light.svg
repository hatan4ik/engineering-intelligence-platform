t-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">policy requires human</text><path d="M 538 245 L 614 245 L 632 146" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="688" y="261" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">plan-bound approval</text><rect x="182.0" y="335" width="96" height="30" rx="15" fill="#f1cecd" stroke="#d46462" stroke-width="1.2" filter="url(#soft-light)"/><text x="230" y="354.5" font-size="12" text-anchor="middle" fill="#642121" font-weight="600">ESCALATED</text><rect x="508.0" y="335" width="96" height="30" rx="15" fill="#f1cecd" stroke="#d46462" stroke-width="1.2" filter="url(#soft-light)"/><text x="556" y="354.5" font-size="12" text-anchor="middle" fill="#642121" font-weight="600">FAILED</text><rect x="705.3" y="335" width="101.4" height="30" rx="15" fill="#f8dfd4" stroke="#e99a7a" stroke-width="1.2" filter="url(#soft-light)"/><text x="756" y="354.5" font-size="12" text-anchor="middle" fill="#70412f" font-weight="600">ROLLED_BACK</text><rect x="882.0" y="335" width="96" height="30" rx="15" fill="#c2e7c2" stroke="#41b23f" stroke-width="1.2" filter="url(#soft-light)"/><text x="930" y="354.5" font-size="12" text-anchor="middle" fill="#0b4f0b" font-weight="600">SUCCEEDED</text><path d="M 408 258 L 262 334" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="270" y="292" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">rejected / expired</text><path d="M 676 145 L 568 334" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="584" y="300" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">unrecoverable</text><path d="M 838 145 L 768 334" fill="none" stroke="#ec835a" stroke-width="1.7" marker-end="url(#arrow-warn-light)"/><text x="796" y="278" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">unhealthy → compensate</text><path d="M 884 145 L 926 334" fill="none" stroke="#0ca30c" stroke-width="1.7" marker-end="url(#arrow-good-light)"/><text x="958" y="218" font-size="11" text-anchor="middle" fill="#52514e" transform="rotate(-90 958 218)" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">healthy — independent signals</text><path d="M 756 365 L 756 396 L 230 396 L 230 366" fill="none" stroke="#d03b3b" stroke-width="1.7" marker-end="url(#arrow-bad-light)"/><text x="496" y="390" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">rollback failed</text></svg>