<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Workflow lifecycle: plans wait on plan-bound approval; verification decides success, rollback or escalation"><defs><filter id="soft-light" x="-12%" y="-12%" width="124%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/></filter><marker id="arrow-light" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#6f6d67"/></marker><marker id="arrow-good-light" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#0ca30c"/></marker><marker id="arrow-bad-light" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#d03b3b"/></marker><marker id="arrow-warn-light" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#ec835a"/></marker></defs><rect x="0" y="0" width="980" height="440" rx="14" fill="#fcfcfb"/><rect x="0.5" y="0.5" width="979" height="439" rx="14" fill="none" stroke="#e1e0d9" stroke-width="1"/><text x="28" y="40" font-size="16" text-anchor="start" fill="#0b0b0b" font-weight="700">Control plane — workflow lifecycle</text><text x="28" y="60" font-size="12" text-anchor="start" fill="#52514e" font-weight="normal">state/models.py WorkflowStatus — approval is bound to the exact plan hash</text><rect x="62.0" y="115" width="96" height="30" rx="15" fill="#dcd9ec" stroke="#7064b4" stroke-width="1.2" filter="url(#soft-light)"/><text x="110" y="134.5" font-size="12" text-anchor="middle" fill="#0b0b0b" font-weight="600">RECEIVED</text><rect x="232.0" y="115" width="96" height="30" rx="15" fill="#