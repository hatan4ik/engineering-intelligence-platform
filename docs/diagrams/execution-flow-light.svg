<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Execution: catalog membership, deterministic policy, plan-bound approval and simulation gate every mutation; verification decides close or rollback"><defs><filter id="soft-light" x="-12%" y="-12%" width="124%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/></filter><marker id="arrow-light" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#6f6d67"/></marker><marker id="arrow-good-light" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#0ca30c"/></marker><marker id="arrow-bad-light" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#d03b3b"/></marker><marker id="arrow-warn-light" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#ec835a"/></marker></defs><rect x="0" y="0" width="980" height="350" rx="14" fill="#fcfcfb"/><rect x="0.5" y="0.5" width="979" height="349" rx="14" fill="none" stroke="#e1e0d9" stroke-width="1"/><text x="28" y="40" font-size="16" text-anchor="start" fill="#0b0b0b" font-weight="700">Execution plane — the authorization gauntlet</text><text x="28" y="60" font-size="12" text-anchor="start" fill="#52514e" font-weight="normal">Agents select from a closed catalog; adapters run fixed commands — never composed strings</text><rect x="24" y="124" width="136" height="52" rx="9" fill="#f9e6dd" stroke="#e69e7e" stroke-width="1.2" filter="url(#soft-light)"/><rect x="24" y="124" width="5" height="52" rx="2.5" fill="#eb6834"/><text x="92.0" y="146.68" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="600">Proposed action</text><text x="92.0" y="162.68" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal">agent output</text><polygon points="258,115.0 324.0,150 258,185.0 192.0,150" fill="#f9e7ed" stroke="#e69eb7" stroke-width="1.3"/><text x="258" y="147" font-size="11.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">in certified</text><text x="258" y="161" font-size="11.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">catalog?</text><polygon points="448,115.0 512.0,150 448,185.0 384.0,150" fill="#f9e7ed" stroke="#e69eb7" stroke-width="1.3"/><text x="448" y="147" font-size="11.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">OPA decision</text><text x="448" y="161" font-size="11.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">fail closed</text><polygon points="636,115.0 702.0,150 636,185.0 570.0,150" fill="#f9e7ed" stroke="#e69eb7" stroke-width="1.3"/><text x="636" y="147" font-size="11.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">approval /</text><text x="636" y="161" font-size="11.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">simulation</text><rect x="760" y="124" width="96" height="52" rx="9" fill="#f9e9ee" stroke="#e5a8bc" stroke-width="1.2" filter="url(#soft-light)"/><rect x="760" y="124" width="5" height="52" rx="2.5" fill="#e87ba4"/><text x="808.0" y="146.68" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="600">Execute</text><text x="808.0" y="162.68" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal">fixed args</text><polygon points="918,118.0 968.0,150 918,182.0 868.0,150" fill="#f9e7ed" stroke="#e69eb7" stroke-width="1.3"/><text x="918" y="154" font-size="11.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">verify</text><path d="M 160 150 L 192 150" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><path d="M 324 150 L 384 150" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="354.0" y="142" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">yes</text><path d="M 512 150 L 570 150" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="541.0" y="142" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">allow</text><path d="M 702 150 L 760 150" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="731.0" y="142" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">pass</text><path d="M 856 150 L 868 150" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><rect x="300" y="260" width="286" height="52" rx="9" fill="#ebeae9" stroke="#b1afa9" stroke-width="1.2" filter="url(#soft-light)"/><rect x="300" y="260" width="5" height="52" rx="2.5" fill="#898781"/><text x="443.0" y="282.68" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="600">Escalate to human</text><text x="443.0" y="298.68" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal">audited — never silent</text><path d="M 258 185 L 258 286 L 300 286" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="270" y="212" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">no</text><path d="M 448 185 L 448 260" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="468" y="212" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">deny</text><path d="M 636 185 L 560 259" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="680" y="212" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">reject / stale</text><rect x="700" y="260" width="110" height="52" rx="9" fill="#f9e9ee" stroke="#e5a8bc" stroke-width="1.2" filter="url(#soft-light)"/><rect x="700" y="260" width="5" height="52" rx="2.5" fill="#e87ba4"/><text x="755.0" y="282.68" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="600">Rollback</text><text x="755.0" y="298.68" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal">compensate</text><path d="M 918 182 L 918 286 L 810 286" fill="none" stroke="#ec835a" stroke-width="1.7" marker-end="url(#arrow-warn-light)"/><text x="940" y="212" font-size="10.5" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">unhealthy</text><path d="M 700 286 L 590 286" fill="none" stroke="#d03b3b" stroke-width="1.7" marker-end="url(#arrow-bad-light)"/><text x="645.0" y="278" font-size="11" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">then escalate</text><rect x="858.0" y="45" width="120" height="30" rx="15" fill="#c2e7c2" stroke="#41b23f" stroke-width="1.2" filter="url(#soft-light)"/><text x="918" y="64.5" font-size="12" text-anchor="middle" fill="#0b4f0b" font-weight="600">close + audit</text><path d="M 918 118 L 918 76" fill="none" stroke="#0ca30c" stroke-width="1.7" marker-end="url(#arrow-good-light)"/><text x="940" y="110" font-size="10.5" text-anchor="middle" fill="#52514e" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">healthy</text></svg>