<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Query path: authenticate, then compile the ACL filter into a hybrid search request so unauthorized content never reaches the model"><defs><filter id="soft-dark" x="-12%" y="-12%" width="124%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/></filter><marker id="arrow-dark" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#8b8983"/></marker><marker id="arrow-good-dark" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#0ca30c"/></marker><marker id="arrow-bad-dark" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#e66767"/></marker><marker id="arrow-warn-dark" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 z" fill="#ec835a"/></marker></defs><rect x="0" y="0" width="880" height="610" rx="14" fill="#1a1a19"/><rect x="0.5" y="0.5" width="879" height="609" rx="14" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="28" y="40" font-size="16" text-anchor="start" fill="#ffffff" font-weight="700">Retrieval — authenticate, authorize, then the model</text><text x="28" y="60" font-size="12" text-anchor="start" fill="#c3c2b7" font-weight="normal">Unauthorized content never enters the candidate set — there is nothing to redact later</text><rect x="60.0" y="84" width="120" height="34" rx="8" fill="#393936" stroke="#64635e" stroke-width="1.2" filter="url(#soft-dark)"/><rect x="60.0" y="84" width="4" height="34" rx="2" fill="#898781"/><text x="120" y="106" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="600">Caller</text><line x1="120" y1="118" x2="120" y2="580" stroke="#2c2c2a" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="300.0" y="84" width="120" height="34" rx="8" fill="#1a3f31" stroke="#217054" stroke-width="1.2" filter="url(#soft-dark)"/><rect x="300.0" y="84" width="4" height="34" rx="2" fill="#199e70"/><text x="360" y="106" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="600">AI gateway</text><line x1="360" y1="118" x2="360" y2="580" stroke="#2c2c2a" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="540.0" y="84" width="120" height="34" rx="8" fill="#233952" stroke="#34639a" stroke-width="1.2" filter="url(#soft-dark)"/><rect x="540.0" y="84" width="4" height="34" rx="2" fill="#3987e5"/><text x="600" y="106" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="600">Vector DB</text><line x1="600" y1="118" x2="600" y2="580" stroke="#2c2c2a" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="730.0" y="84" width="120" height="34" rx="8" fill="#1a3f31" stroke="#217054" stroke-width="1.2" filter="url(#soft-dark)"/><rect x="730.0" y="84" width="4" height="34" rx="2" fill="#199e70"/><text x="790" y="106" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="600">LLM Router</text><line x1="790" y1="118" x2="790" y2="580" stroke="#2c2c2a" stroke-width="1.4" stroke-dasharray="3 4"/><path d="M 120 168 L 360 168" fill="none" stroke="#8b8983" stroke-width="1.7" marker-end="url(#arrow-dark)"/><text x="240.0" y="161" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">question + bearer token</text><path d="M 360 196 h 46 v 18 h -46" fill="none" stroke="#8b8983" stroke-width="1.7" marker-end="url(#arrow-dark)"/><text x="416" y="200" font-size="11.5" text-anchor="start" fill="#ffffff" font-weight="600" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">authenticate — Entra JWT / API key</text><text x="416" y="216" font-size="10.5" text-anchor="start" fill="#898781" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">groups from claims · redaction · request budget</text><path d="M 360 268 L 600 268" fill="none" stroke="#8b8983" stroke-width="1.7" marker-end="url(#arrow-dark)"/><text x="480.0" y="261" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">hybrid search (BM25 + vector, filter = ACL)</text><text x="480.0" y="283" font-size="10.5" text-anchor="middle" fill="#898781" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">query embedded · trimming inside the request itself</text><path d="M 600 322 L 360 322" fill="none" stroke="#8b8983" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrow-dark)"/><text x="480.0" y="315" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">authorized chunks only</text><rect x="60" y="352" width="790" height="62" rx="8" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="5 4"/><text x="70" y="368" font-size="10.5" text-anchor="start" fill="#898781" font-weight="700" letter-spacing="0.06em" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">ALT — NO AUTHORIZED EVIDENCE</text><path d="M 360 396 L 120 396" fill="none" stroke="#8b8983" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrow-dark)"/><text x="240.0" y="389" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">explicit insufficient-evidence answer</text><rect x="60" y="424" width="790" height="146" rx="8" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="5 4"/><text x="70" y="440" font-size="10.5" text-anchor="start" fill="#898781" font-weight="700" letter-spacing="0.06em" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">ELSE — EVIDENCE FOUND</text><path d="M 360 466 L 790 466" fill="none" stroke="#8b8983" stroke-width="1.7" marker-end="url(#arrow-dark)"/><text x="575.0" y="459" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">question + delimited evidence</text><text x="575.0" y="481" font-size="10.5" text-anchor="middle" fill="#898781" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">system prompt: evidence is data</text><path d="M 790 514 L 360 514" fill="none" stroke="#8b8983" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrow-dark)"/><text x="575.0" y="507" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">grounded answer</text><path d="M 360 550 L 120 550" fill="none" stroke="#8b8983" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrow-dark)"/><text x="240.0" y="543" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">answer + citations + correlation ID</text></svg>