ub</text><line x1="110" y1="118" x2="110" y2="530" stroke="#e1e0d9" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="270.0" y="84" width="120" height="34" rx="8" fill="#d4eee4" stroke="#6ac3a0" stroke-width="1.2" filter="url(#soft-light)"/><rect x="270.0" y="84" width="4" height="34" rx="2" fill="#1baf7a"/><text x="330" y="106" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Ingress</text><line x1="330" y1="118" x2="330" y2="530" stroke="#e1e0d9" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="480.4" y="84" width="159.2" height="34" rx="8" fill="#f9e1d7" stroke="#e79876" stroke-width="1.2" filter="url(#soft-light)"/><rect x="480.4" y="84" width="4" height="34" rx="2" fill="#eb6834"/><text x="560" y="106" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">PRGuardianService</text><line x1="560" y1="118" x2="560" y2="530" stroke="#e1e0d9" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="715.6" y="84" width="128.8" height="34" rx="8" fill="#dcd9ec" stroke="#867cbb" stroke-width="1.2" filter="url(#soft-light)"/><rect x="715.6" y="84" width="4" height="34" rx="2" fill="#4a3aa7"/><text x="780" y="106" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Control plane</text><line x1="780" y1="118" x2="780" y2="530" stroke="#e1e0d9" stroke-width="1.4" stroke-dasharray="3 4"/><path d="M 110 170 L 330 170" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x="220.0" y="163" font-size="11.5" text-anchor="middle" fill="#0b0b0b" font-weight="600" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">pull_request event</text><text x="220.0" y="185" font-size="10.5" text-anchor="middle" fill="#898781" font-weight="normal" paint-order="stroke" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round">webhook or Actions runner</text><path d="M 330 196 h 46 v 18 h -46" fill="none" stroke="#6f6d67" stroke-width="1.7" marker-end="url(#arrow-light)"/><text x=