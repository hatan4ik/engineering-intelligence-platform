{{- if .Values.temporalWorker.enabled }}
{{- $worker := .Values.temporalWorker }}
{{- $workerServiceAccount := required "temporalWorker.serviceAccount.name is required when the Temporal worker is enabled" $worker.serviceAccount.name }}
{{- if lt (int $worker.replicaCount) 2 }}
{{- fail "temporalWorker.replicaCount must be at least 2 for the worker disruption budget" }}
{{- end }}
{{- $endpoint := required "temporalWorker.endpoint is required when the Temporal worker is enabled" $worker.endpoint }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9.-]*:[0-9]{2,5}$" $endpoint) }}
{{- fail "temporalWorker.endpoint must be a private DNS host:port" }}
{{- end }}
{{- $namespace := required "temporalWorker.namespace is required when the Temporal worker is enabled" $worker.namespace }}
{{- $taskQueue := required "temporalWorker.taskQueue is required when the Temporal worker is enabled" $worker.taskQueue }}
{{- $tlsSecret := required "temporalWorker.tls.secretName must name a pre-created mTLS Secret" $worker.tls.secretName }}
{{- $tlsServerName := required "temporalWorker.tls.serverName is required for Temporal mTLS" $worker.tls.serverName }}
{{- range $keyName, $keyValue := dict "caCertKey" $worker.tls.caCertKey "clientCertKey" $worker.tls.clientCertKey "clientKeyKey" $worker.tls.clientKeyKey }}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $keyValue) }}
{{- fail (printf "temporalWorker.tls.%s must be a Kubernetes Secret key" $keyName) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $workerServiceAccount }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-temporal-worker
spec:
  replicas: {{ $worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: temporal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: temporal-worker
    spec:
      serviceAccountName: {{ $workerServiceAccount }}
      terminationGracePeriodSeconds: 60
      securityContext:
{{ toYaml $worker.podSecurityContext | indent 8 }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: temporal-worker
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "orchestration.temporal_worker"]
          env:
            - name: EIP_CONTROL_PLANE_MODE
              value: "temporal"
            - name: EIP_TEMPORAL_ENDPOINT
              value: {{ $endpoint | quote }}
            - name: EIP_TEMPORAL_NAMESPACE
              value: {{ $namespace | quote }}
            - name: EIP_TEMPORAL_TASK_QUEUE
              value: {{ $taskQueue | quote }}
            - name: EIP_TEMPORAL_TLS_SERVER_NAME
              value: {{ $tlsServerName | quote }}
            - name: EIP_TEMPORAL_TLS_CA_CERT_PATH
              value: "/var/run/eip/temporal-tls/{{ $worker.tls.caCertKey }}"
            - name: EIP_TEMPORAL_TLS_CLIENT_CERT_PATH
              value: "/var/run/eip/temporal-tls/{{ $worker.tls.clientCertKey }}"
            - name: EIP_TEMPORAL_TLS_CLIENT_KEY_PATH
              value: "/var/run/eip/temporal-tls/{{ $worker.tls.clientKeyKey }}"
          volumeMounts:
            - name: temporal-client-tls
              mountPath: /var/run/eip/temporal-tls
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
          resources:
{{ toYaml $worker.resources | indent 12 }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
      volumes:
        - name: temporal-client-tls
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 0440
        - name: temporary-files
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-temporal-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: temporal-worker
{{- end }}
