# Deliberately incomplete. Supplying a reviewed values file is required before
# this chart renders, so `helm install` cannot accidentally deploy the demo.
replicaCount: 2
image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  port: 80
  targetPort: 8000
serviceAccount:
  name: eip-api
  # Set from Terraform output workload_identity_client_id.
  azureClientId: ""
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  # The Helm deployment surface is only for the Azure-backed, authenticated
  # workload. The deterministic/header-identity demo remains a local command.
  EIP_BACKEND: azure
  EIP_ALLOW_HEADER_IDENTITY: "false"
  EIP_AUTH_MODE: entra
  EIP_ENTRA_TENANT_ID: ""
  EIP_ENTRA_AUDIENCE: ""
  AZURE_SEARCH_ENDPOINT: ""
  AZURE_SEARCH_INDEX: ""
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_CHAT_DEPLOYMENT: ""
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ""
  AZURE_OPENAI_API_VERSION: "2024-10-21"
podAnnotations: {}
temporalWorker:
  # Off by default: only enable after the separate Temporal server, mTLS
  # identity, Cosmos RBAC, and immutable-audit evidence path are reviewed.
  enabled: false
  replicaCount: 2
  serviceAccount:
    name: eip-temporal-worker
    azureClientId: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  endpoint: ""
  namespace: ""
  taskQueue: ""
  tls:
    # Existing Secret only. It must contain a CA, client certificate, and
    # private key provisioned by the approved certificate path.
    secretName: ""
    serverName: ""
    caCertKey: ca.crt
    clientCertKey: tls.crt
    clientKeyKey: tls.key
  cosmos:
    endpoint: ""
    database: ""
    stateContainer: ""
  immutableAuditEvidenceUri: ""
