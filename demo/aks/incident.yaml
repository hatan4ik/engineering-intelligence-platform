apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: eip-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
        - name: memory-hog
          image: python:3.12-slim
          command: ["python", "-c"]
          args:
            - |
              import time
              x=[]
              while True:
                  x.append('x'*1024*1024)
                  time.sleep(0.2)
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
