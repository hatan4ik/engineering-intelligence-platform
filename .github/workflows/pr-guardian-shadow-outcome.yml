name: PR Guardian Shadow Outcome

on:
  pull_request_target:
    types: [closed]

# The closed-event payload is read as data. This job checks out only the trusted
# default branch, never the pull-request revision, and has no deployment or
# cloud credentials.
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r app/requirements.txt
      - name: Capture closed PR calibration outcome
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
          EIP_PR_GUARDIAN_OUTCOME_PATH: pr-guardian-shadow-outcome.json
        run: python scripts/capture_pr_guardian_shadow_outcome.py
      - name: Retain closure export for the pilot window
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-guardian-shadow-outcome
          path: pr-guardian-shadow-outcome.json
          if-no-files-found: error
          retention-days: 14
