name: PR Guardian Shadow (non-blocking)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# This workflow evaluates a pull request with no write capability.  Do not make
# this check required: its findings are advisory and a policy simulation must
# never stop a merge.
permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate:
    name: Evaluate shadow observation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r app/requirements.txt
      - name: Evaluate PR Guardian in shadow mode
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
          EIP_STATE_DIR: .eip
          EIP_PR_GUARDIAN_MODE: shadow
          EIP_PR_GUARDIAN_RESULT_PATH: pr-guardian-shadow-result.json
        run: python scripts/run_pr_guardian.py
      - name: Retain transferable shadow observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-guardian-shadow-result
          path: pr-guardian-shadow-result.json
          if-no-files-found: error
          retention-days: 14
