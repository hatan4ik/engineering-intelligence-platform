name: Build Board Deck

on:
  push:
    paths:
      - 'slides/**'
      - 'docs/board-deck-narrative.md'
  pull_request:
    paths:
      - 'slides/**'
      - 'docs/board-deck-narrative.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r slides/requirements.txt
      - run: python slides/build_deck.py
      - run: test -s slides/engineering-intelligence-board-deck.pptx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-intelligence-board-deck
          path: slides/engineering-intelligence-board-deck.pptx
          if-no-files-found: error
