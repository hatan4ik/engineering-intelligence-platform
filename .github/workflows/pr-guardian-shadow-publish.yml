name: PR Guardian Shadow Publisher

on:
  workflow_run:
    workflows: [PR Guardian Shadow (non-blocking)]
    types: [completed]

# This is the only shadow workflow with write scope. It runs trusted code from
# the default branch and reads a strictly validated JSON result; it never checks
# out or executes the pull-request head revision.
permissions:
  actions: read
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pr-guardian-shadow-result
          path: shadow-input
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r app/requirements.txt
      - name: Publish neutral shadow observation
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
          EIP_PR_GUARDIAN_RESULT_PATH: shadow-input/pr-guardian-shadow-result.json
        run: python scripts/publish_pr_guardian_shadow.py
