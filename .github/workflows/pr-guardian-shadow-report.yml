name: PR Guardian Shadow Report

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:17 UTC. The pilot window is measured in weeks, so a
    # weekly report is the shortest useful cadence.
    - cron: '17 6 * * 1'

# Read-only. This job summarizes retained closure artifacts; it cannot publish a
# check, comment on a pull request, or change any repository setting.
permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r app/requirements.txt
      - name: Download retained shadow closure artifacts
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p shadow-outcomes
          runs="$(gh run list \
            --workflow pr-guardian-shadow-outcome.yml \
            --branch "$DEFAULT_BRANCH" \
            --status success \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId')"
          for run_id in $runs; do
            # Artifacts expire after their retention window; a run whose export
            # is gone is skipped rather than failing the report.
            gh run download "$run_id" \
              --pattern 'pr-guardian-shadow-outcome*' \
              --dir "shadow-outcomes/$run_id" || true
          done
          count="$(find shadow-outcomes -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_STEP_OUTPUT"
      - name: Report that no closure artifacts are retained
        if: steps.download.outputs.count == '0'
        run: |
          {
            echo "## PR Guardian shadow report"
            echo
            echo "No retained \`pr-guardian-shadow-outcome\` artifacts were found on the default"
            echo "branch, so no report was produced. This is not a result: the shadow pilot has"
            echo "either not run, or every closure export has passed its retention window."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize the shadow pilot
        if: steps.download.outputs.count != '0'
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/summarize_pr_guardian_shadow.py shadow-outcomes \
            --output pr-guardian-shadow-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("pr-guardian-shadow-report.json").read_text(encoding="utf-8"))
          sample = report["sample"]
          readiness = report["promotion_readiness"]
          print("## PR Guardian shadow report")
          print()
          print(f"- decision: `{readiness['decision']}`")
          print(f"- blocking_authorized: `{readiness['blocking_authorized']}`")
          print(f"- next review: {readiness['next_review']}")
          print()
          print("| sample | count |")
          print("| --- | --- |")
          for key, value in sample.items():
              print(f"| {key} | {value} |")
          print()
          unmet = readiness["unmet_requirements"]
          if unmet:
              print("Unmet promotion requirements:")
              print()
              for name in unmet:
                  print(f"- `{name}`")
          else:
              print("All promotion requirements are met. This authorizes a human evidence")
              print("review only; it does not enable merge blocking.")
          PY
      - name: Retain the report
        if: steps.download.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-guardian-shadow-report
          path: pr-guardian-shadow-report.json
          if-no-files-found: error
          retention-days: 90
